services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: helvoca
      POSTGRES_USER: helvoca
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helvoca}
    ports:
      - "5432:5432"
    volumes:
      - helvoca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helvoca -d helvoca"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/helvoca
      DB_USERNAME: helvoca
      DB_PASSWORD: ${DB_PASSWORD:-helvoca}
      JWT_ISSUER: ${JWT_ISSUER:-helvoca-api}
      JWT_SECRET: ${JWT_SECRET:-Y2FsbGFpLWRldi1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMhISE=}
      SEED_ENABLED: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@helvoca.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PUBLIC_BASE_URL: ${TWILIO_PUBLIC_BASE_URL:-}
      TWILIO_MEDIA_STREAM_PATH: ${TWILIO_MEDIA_STREAM_PATH:-/ws/v1/twilio/media}
      TWILIO_WHATSAPP_ENABLED: ${TWILIO_WHATSAPP_ENABLED:-false}
      TWILIO_WHATSAPP_WEBHOOK_VALIDATION_ENABLED: ${TWILIO_WHATSAPP_WEBHOOK_VALIDATION_ENABLED:-true}
      TWILIO_WHATSAPP_SESSION_HOURS: ${TWILIO_WHATSAPP_SESSION_HOURS:-24}
      HELVOCA_OUTBOUND_DELIVERY_ENABLED: ${HELVOCA_OUTBOUND_DELIVERY_ENABLED:-false}
      HELVOCA_OUTBOUND_PROVIDER: ${HELVOCA_OUTBOUND_PROVIDER:-NONE}
      APP_JOBS_ENABLED: ${APP_JOBS_ENABLED:-false}
    ports:
      - "8080:8080"

volumes:
  helvoca_pgdata:

<svg width="760" height="760" viewBox="0 0 760 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">RecepVoz atiende una llamada</title>
<desc id="desc">Ilustración de un teléfono con ondas de voz y mensajes de una recepcionista virtual.</desc>
<defs>
  <linearGradient id="phone" x1="225" y1="130" x2="565" y2="650" gradientUnits="userSpaceOnUse">
    <stop stop-color="#153047"/>
    <stop offset=".55" stop-color="#071624"/>
    <stop offset="1" stop-color="#101A3D"/>
  </linearGradient>
  <linearGradient id="accent" x1="280" y1="290" x2="520" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#16D9F5"/>
    <stop offset=".55" stop-color="#42E3F7"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="bubble" x1="80" y1="80" x2="440" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#102B3F"/>
    <stop offset="1" stop-color="#111B3F"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000814" flood-opacity=".5"/>
  </filter>
</defs>

<ellipse cx="408" cy="410" rx="270" ry="250" fill="#16D9F5" fill-opacity=".11" filter="url(#glow)"/>
<ellipse cx="485" cy="330" rx="210" ry="210" fill="#8B5CF6" fill-opacity=".13" filter="url(#glow)"/>

<g opacity=".55">
  <path d="M102 472C176 334 266 267 397 259C517 252 618 318 672 434" stroke="#16D9F5" stroke-opacity=".45" stroke-width="3"/>
  <path d="M76 512C170 614 325 650 471 615C573 590 643 532 686 462" stroke="#8B5CF6" stroke-opacity=".4" stroke-width="3"/>
  <circle cx="109" cy="475" r="7" fill="#16D9F5"/>
  <circle cx="672" cy="434" r="6" fill="#8B5CF6"/>
</g>

<g filter="url(#soft)" transform="rotate(7 438 398)">
  <rect x="266" y="104" width="340" height="566" rx="58" fill="url(#phone)" stroke="#2B617C" stroke-width="5"/>
  <rect x="286" y="129" width="300" height="518" rx="43" fill="#06111C" stroke="#163549" stroke-width="2"/>
  <rect x="380" y="146" width="112" height="24" rx="12" fill="#020812"/>
  <circle cx="509" cy="158" r="5" fill="#173448"/>
  <path d="M329 212H543" stroke="#163549" stroke-width="2"/>
  <g transform="translate(345 245)">
    <rect x="0" y="28" width="18" height="82" rx="9" fill="url(#accent)"/>
    <rect x="32" y="6" width="18" height="126" rx="9" fill="url(#accent)"/>
    <rect x="64" y="43" width="18" height="52" rx="9" fill="url(#accent)"/>
    <rect x="96" y="20" width="18" height="98" rx="9" fill="url(#accent)"/>
    <rect x="128" y="54" width="18" height="30" rx="9" fill="url(#accent)"/>
  </g>
  <text x="436" y="418" fill="#F4FBFF" font-size="28" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">RecepVoz</text>
  <text x="436" y="451" fill="#8FA8B8" font-size="17" font-family="Arial, sans-serif" text-anchor="middle">Llamada entrante</text>
  <g transform="translate(329 510)">
    <circle cx="38" cy="38" r="38" fill="#EF4444"/>
    <path d="M22 38C29 31 45 31 53 38" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <circle cx="176" cy="38" r="38" fill="#18C982"/>
    <path d="M161 23C170 35 176 41 190 52" stroke="white" stroke-width="8" stroke-linecap="round"/>
  </g>
</g>

<g filter="url(#soft)">
  <rect x="63" y="118" width="287" height="128" rx="24" fill="url(#bubble)" stroke="#2186A1" stroke-width="2"/>
  <circle cx="103" cy="159" r="22" fill="#0B8CB4"/>
  <path d="M95 160H111M103 152V168" stroke="#E6FBFF" stroke-width="3" stroke-linecap="round"/>
  <text x="139" y="150" fill="#F4FBFF" font-size="17" font-family="Arial, sans-serif" font-weight="700">Hola, soy tu recepcionista</text>
  <text x="139" y="177" fill="#A7BDCC" font-size="16" font-family="Arial, sans-serif">virtual. ¿En qué puedo ayudarte?</text>
  <path d="M300 244L326 274L334 239" fill="#102434" stroke="#2186A1" stroke-width="2"/>
</g>

<g filter="url(#soft)">
  <rect x="76" y="297" width="253" height="115" rx="24" fill="#131C48" stroke="#5F46C9" stroke-width="2"/>
  <circle cx="115" cy="336" r="21" fill="#7453E8"/>
  <circle cx="115" cy="330" r="7" fill="#F4FBFF"/>
  <path d="M103 349C109 341 122 341 128 349" stroke="#F4FBFF" stroke-width="4" stroke-linecap="round"/>
  <text x="151" y="329" fill="#F4FBFF" font-size="16" font-family="Arial, sans-serif" font-weight="700">Quiero reservar una mesa</text>
  <text x="151" y="355" fill="#B8BCEB" font-size="15" font-family="Arial, sans-serif">para mañana a las 20:00.</text>
  <path d="M292 408L315 434L319 402" fill="#131C48" stroke="#5F46C9" stroke-width="2"/>
</g>

<g filter="url(#soft)">
  <rect x="82" y="500" width="278" height="128" rx="24" fill="url(#bubble)" stroke="#2186A1" stroke-width="2"/>
  <circle cx="123" cy="540" r="22" fill="#0B8CB4"/>
  <path d="M115 540H131M123 532V548" stroke="#E6FBFF" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="532" fill="#F4FBFF" font-size="16" font-family="Arial, sans-serif" font-weight="700">Perfecto. Reserva creada.</text>
  <text x="160" y="559" fill="#A7BDCC" font-size="15" font-family="Arial, sans-serif">Tu cliente recibe confirmación.</text>
  <circle cx="322" cy="590" r="18" fill="#18C982"/>
  <path d="M313 590L320 597L333 582" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M329 626L350 648L355 620" fill="#102434" stroke="#2186A1" stroke-width="2"/>
</g>
</svg>
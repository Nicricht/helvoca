<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Configuración · RecepVoz</title>
  <meta http-equiv="refresh" content="0;url=/app/settings">
  <script>
    (() => {
      const sectionAliases = {
        business: "business",
        general: "business",
        receptionist: "receptionist",
        services: "services",
        hours: "hours",
        knowledge: "knowledge",
        responses: "knowledge",
        channels: "channels",
        integrations: "integrations",
        team: "team"
      };
      const source = new URL(window.location.href);
      const requested = (source.searchParams.get("section") || "").toLowerCase();
      const target = new URL("/app/settings", source.origin);
      const section = sectionAliases[requested]
        || (source.hash === "#configuration" ? "business" : "");
      if (section) target.searchParams.set("section", section);
      window.location.replace(target.pathname + target.search);
    })();
  </script>
</head>
<body>
  <main>
    <p>Configuración se movió a la aplicación principal.</p>
    <a href="/app/settings">Ir a Configuración</a>
  </main>
</body>
</html>

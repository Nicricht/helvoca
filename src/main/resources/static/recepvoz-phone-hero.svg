<svg width="900" height="1100" viewBox="0 0 900 1100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">RecepVoz en una llamada entrante</title>
<desc id="desc">Teléfono oscuro inclinado con identidad RecepVoz, onda de voz y botones para responder o rechazar una llamada.</desc>
<defs>
  <linearGradient id="frame" x1="208" y1="126" x2="704" y2="941" gradientUnits="userSpaceOnUse">
    <stop stop-color="#6EEBFF"/>
    <stop offset=".18" stop-color="#1D8FB8"/>
    <stop offset=".52" stop-color="#101A31"/>
    <stop offset=".82" stop-color="#7A4BFF"/>
    <stop offset="1" stop-color="#B47AFF"/>
  </linearGradient>
  <linearGradient id="body" x1="250" y1="130" x2="650" y2="980" gradientUnits="userSpaceOnUse">
    <stop stop-color="#102537"/>
    <stop offset=".42" stop-color="#07121E"/>
    <stop offset="1" stop-color="#0B0F24"/>
  </linearGradient>
  <linearGradient id="screen" x1="260" y1="170" x2="635" y2="930" gradientUnits="userSpaceOnUse">
    <stop stop-color="#071521"/>
    <stop offset=".55" stop-color="#04101A"/>
    <stop offset="1" stop-color="#07142C"/>
  </linearGradient>
  <linearGradient id="voice" x1="300" y1="430" x2="620" y2="620" gradientUnits="userSpaceOnUse">
    <stop stop-color="#16D9F5"/>
    <stop offset=".55" stop-color="#42E3F7"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(470 555) rotate(90) scale(440 360)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#16D9F5" stop-opacity=".24"/>
    <stop offset=".58" stop-color="#8B5CF6" stop-opacity=".1"/>
    <stop offset="1" stop-color="#08111C" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="34"/>
  </filter>
  <filter id="shadow" x="-50%" y="-40%" width="220%" height="220%">
    <feDropShadow dx="0" dy="42" stdDeviation="34" flood-color="#000713" flood-opacity=".68"/>
  </filter>
  <filter id="smallGlow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>

<ellipse cx="470" cy="565" rx="330" ry="410" fill="url(#aura)" filter="url(#blur)"/>

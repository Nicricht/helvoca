spring:
  application:
    name: helvoca
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helvoca}
    username: ${DB_USERNAME:helvoca}
    password: ${DB_PASSWORD:helvoca}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: ${JWT_ISSUER:helvoca-api}
    secret: ${JWT_SECRET:Y2FsbGFpLWRldi1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMhISE=}
    access-token-minutes: ${JWT_ACCESS_MINUTES:60}
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@helvoca.local}
    admin-password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}
  voice:
    telephony-provider: ${HELVOCA_TELEPHONY_PROVIDER:twilio}
    ai-provider: ${HELVOCA_VOICE_AI_PROVIDER:openai}
  twilio:
    auth-token: ${TWILIO_AUTH_TOKEN:}
    public-base-url: ${TWILIO_PUBLIC_BASE_URL:}
    media-stream-url: ${TWILIO_MEDIA_STREAM_URL:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    realtime-model: ${OPENAI_REALTIME_MODEL:gpt-realtime-2.1}
    voice: ${OPENAI_REALTIME_VOICE:marin}
    transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-live-transcribe}
    summary-model: ${OPENAI_SUMMARY_MODEL:gpt-5.6-luna}
    trial-model: ${OPENAI_TRIAL_MODEL:gpt-5.6-luna}
    realtime-url: ${OPENAI_REALTIME_URL:wss://api.openai.com/v1/realtime}
    responses-url: ${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
    live:
      enabled: ${OPENAI_LIVE_ENABLED:false}
      project-id: ${OPENAI_PROJECT_ID:}
      webhook-secret: ${OPENAI_WEBHOOK_SECRET:}
      model: ${OPENAI_LIVE_MODEL:gpt-live-1}
      backend-model: ${OPENAI_LIVE_BACKEND_MODEL:gpt-5.6-luna}
      voice: ${OPENAI_LIVE_VOICE:marin}
      api-base-url: ${OPENAI_LIVE_API_BASE_URL:https://api.openai.com/v1}
      sideband-base-url: ${OPENAI_LIVE_SIDEBAND_BASE_URL:wss://api.openai.com/v1}
      webhook-tolerance-seconds: ${OPENAI_WEBHOOK_TOLERANCE_SECONDS:300}

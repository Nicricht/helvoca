name: Pilot Voice Phase 2 Carrier Identity Offline

on:
  push:
    branches:
      - 'feat/voice-real-pilot-2of6-*'

permissions:
  contents: read

jobs:
  twilio-carrier-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWILIO_PROVISIONING_ENABLED: 'false'
      HELVOCA_TWILIO_EXISTING_VOICE_ROUTE_ENABLED: 'false'
      HELVOCA_TWILIO_SUBACCOUNT_VOICE_CONFIGURE_ON_STARTUP: 'false'
      TWILIO_CERTIFICATION_CALL_ON_STARTUP: 'false'
      GEMINI_LIVE_ENABLED: 'false'
      HELVOCA_CONTROLLED_PILOT_EXTERNAL_EFFECTS_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify main/subaccount identities, signed callbacks, RLS and ownership read-only contracts
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=TwilioLiveCallAdmissionReadinessTest,VoiceCarrierOwnershipPreflightServiceTest,VoiceCarrierOwnershipPreflightControllerTest,VoiceRealCallPreflightServiceTest,TwilioExistingNumberOwnershipVerifierTest,TwilioCallBindingGuardTest,TwilioVerifiedExistingVoiceRouteGateTest,TwilioSignatureValidatorTest,TwilioSignatureValidationFilterTest,TwilioAuthTokenResolverTest,TwilioTenantBindingIntegrationTest,PostgresRowLevelSecurityIntegrationTest
          test

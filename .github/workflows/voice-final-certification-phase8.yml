name: Phase 8 Offline Final Call Certification Evidence

# No live phone calls, paid provider sessions, public webhooks or production database.
on:
  push:
    branches:
      - 'test/voice-final-certification-phase8-*'

permissions:
  contents: read

jobs:
  final-voice-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWILIO_PROVISIONING_ENABLED: 'false'
      HELVOCA_TWILIO_EXISTING_VOICE_ROUTE_ENABLED: 'false'
      GEMINI_LIVE_ENABLED: 'false'
      GEMINI_LIVE_PROBE_ON_STARTUP: 'false'
      HELVOCA_CONTROLLED_PILOT_EXTERNAL_EFFECTS_ENABLED: 'false'
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify booked-and-cancelled same entity, 12 technical checks and tenant-safe PostgreSQL 16
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=CallCertificationBookingEvidencePhase8Test,CallCertificationStatusServiceEvidenceTest,CallCertificationServiceTest,TwilioMediaStreamStartupRecoveryPhase7Test,TwilioMediaStreamHandlerTest,TwilioTenantBindingIntegrationTest,PostgresRowLevelSecurityIntegrationTest
          test

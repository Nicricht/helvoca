name: SaaS Billing Sandbox Provider Certification

on:
  workflow_dispatch:
    inputs:
      payer_email:
        description: "Mercado Pago TEST payer email (@testuser.com)"
        required: true
        type: string
      expected_test_seller_id:
        description: "Test SELLER User ID from Mercado Pago Test Accounts (digits only)"
        required: true
        type: string
      confirm_test_credential_source:
        description: "Type I_VERIFIED_TEST_CREDENTIALS after checking Test, not Production"
        required: true
        type: string
      confirm_sandbox:
        description: "I confirm this run uses Mercado Pago TEST credentials only"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: saas-billing-sandbox-provider-certification
  cancel-in-progress: false

jobs:
  sandbox-provider:
    name: mercadopago-sandbox-provider
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONFIRM_SANDBOX: ${{ inputs.confirm_sandbox }}
      CONFIRM_TEST_CREDENTIAL_SOURCE: ${{ inputs.confirm_test_credential_source }}
      MERCADOPAGO_EXPECTED_TEST_SELLER_ID: ${{ inputs.expected_test_seller_id }}
      HELVOCA_SAAS_BILLING_SANDBOX_LIVE_TEST: "true"
      MERCADOPAGO_TEST_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
      MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
      MERCADOPAGO_TEST_PAYER_EMAIL: ${{ inputs.payer_email }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify TEST seller provenance before any subscription creation
        shell: bash
        run: |
          set -euo pipefail
          # APP_USR is used by both TEST and PRODUCTION credentials.
          # A missing or false test_user identity blocks all provider writes.
          python3 scripts/ops/c5_mercadopago_sandbox_preflight.py
          echo "HELVOCA_C5_PROVENANCE_GATE_PASSED=true" >> "$GITHUB_ENV"

      - name: Run real Mercado Pago sandbox provider certification
        run: |
          mvn -B -Dtest=MercadoPagoSaasSandboxProviderIT test

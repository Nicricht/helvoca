name: Onboarding DEMO browser smoke

on:
  pull_request:
    paths:
      - "playwright.preview.config.cjs"
      - "tools/demo-preview/live-browser.spec.cjs"
      - ".github/workflows/onboarding-demo-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    name: four-sector-live-preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test real published preview in Chromium
        run: npx playwright test --config=playwright.preview.config.cjs
      - name: Preserve diagnostics on failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-preview-browser-failure
          path: |
            playwright-preview-report/
            test-results/
          if-no-files-found: ignore

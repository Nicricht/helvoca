name: Frontend Finish Safe CI

on:
  push:
    branches:
      - feat/frontend-finish-integration

permissions:
  contents: read

jobs:
  integration-safe-gate:
    if: contains(github.event.head_commit.message, '[frontend-finish-safe-ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile application
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Verify public console asset contract
        run: mvn --batch-mode --no-transfer-progress -Dtest=ConsoleScriptAssetsContractTest test

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/phone-provisioning.js
          node --check src/main/resources/static/commercial-status.js
          node --check src/main/resources/static/voice-selector.js
          node --check src/main/resources/static/ux-simplification.js
          node --check src/main/resources/static/pricing.js
          node --check src/main/resources/static/home-business.js
          node --check src/main/resources/static/settings-page.js
          node --check src/main/resources/static/inventory.js
          node --check src/main/resources/static/conversations.js
          node --check src/main/resources/static/simulator.js
          node --check src/main/resources/static/account.js
          node --check src/main/resources/static/first-user-ux-v2.js

      - name: Install frontend test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run full frontend E2E
        run: npm run test:e2e

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-finish-safe-ci-diagnostics
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn

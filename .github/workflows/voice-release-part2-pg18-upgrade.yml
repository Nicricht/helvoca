name: Helvoca Part 2 PG16/PG18 & V99-to-V103 Flyway Upgrade (isolated)

on:
  push:
    branches:
      - 'test/voice-release-part2-pg18-upgrade-*'
  pull_request:
    paths:
      - '.github/workflows/voice-release-part2-pg18-upgrade.yml'
      - 'scripts/ci/voice_part2_migration_contract.py'
      - 'scripts/ci/test_voice_part2_migration_contract.py'
      - 'src/main/resources/db/migration/V10*.sql'
      - 'src/test/java/cl/helvoca/phone/TwilioV99ToV103FlywayUpgradePostgresIntegrationTest.java'
      - 'src/test/java/cl/helvoca/phone/TwilioVerifiedExistingMigrationPostgresIntegrationTest.java'
      - 'src/test/java/cl/helvoca/security/PostgresRowLevelSecurityIntegrationTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-migration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check frozen V100-V103 migration contents and no auto-backfill
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_voice_part2_migration_contract.py' -v
          python3 scripts/ci/voice_part2_migration_contract.py

  flyway-upgrade-and-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pg_image: ['postgres:16-alpine', 'postgres:18-alpine']
    env:
      HELVOCA_OUTBOUND_DELIVERY_ENABLED: 'false'
      HELVOCA_TWILIO_EXISTING_VOICE_ROUTE_ENABLED: 'false'
      HELVOCA_TWILIO_SUBACCOUNT_VOICE_CONFIGURE_ON_STARTUP: 'false'
      HELVOCA_CONTROLLED_PILOT_EXTERNAL_EFFECTS_ENABLED: 'false'
      GEMINI_LIVE_ENABLED: 'false'
      OPENAI_LIVE_ENABLED: 'false'
      TWILIO_PROVISIONING_ENABLED: 'false'
      TWILIO_CERTIFICATION_CALL_ON_STARTUP: 'false'
      TWILIO_CERTIFICATION_COMMAND_RUNNER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run selected real Flyway and tenant RLS tests in disposable Testcontainers
        shell: bash
        run: |
          set -euo pipefail
          tests="TwilioVerifiedExistingMigrationPostgresIntegrationTest,PostgresRowLevelSecurityIntegrationTest"
          if [[ "${{ matrix.pg_image }}" == "postgres:18-alpine" ]]; then
            tests="$tests,TwilioV99ToV103FlywayUpgradePostgresIntegrationTest"
          fi
          mvn --batch-mode --no-transfer-progress -Dhelvoca.test.postgres.image="${{ matrix.pg_image }}" -Dtest="$tests" test

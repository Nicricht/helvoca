name: RecepVoz CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate console JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/phone-provisioning.js
          node --check src/main/resources/static/commercial-status.js
          node --check src/main/resources/static/voice-selector.js
          node --check src/main/resources/static/pricing.js
          node --check src/main/resources/static/operations.js
          node --check src/main/resources/static/simulator.js

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Summarize backend test diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "### Backend test diagnostics"
            echo '```text'
            find . -type f \( -path '*/target/surefire-reports/*.txt' -o -path '*/target/failsafe-reports/*.txt' \) -print0 \
              | xargs -0 -r grep -Hn -E 'Tests run:|<<< FAILURE!|<<< ERROR!|AssertionFailedError|Caused by:|ERROR' \
              | head -n 200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 1

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

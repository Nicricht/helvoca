  orders-qa:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[orders-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report orders QA pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PAYLOAD=$(printf '{"state":"pending","context":"helvoca/orders-qa","description":"Orders QA running"}')
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Node.js

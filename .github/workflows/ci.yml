name: RecepVoz CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate console JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/phone-provisioning.js
          node --check src/main/resources/static/commercial-status.js
          node --check src/main/resources/static/voice-selector.js
          node --check src/main/resources/static/pricing.js
          node --check src/main/resources/static/operations.js
          node --check src/main/resources/static/simulator.js

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Surface Maven test failures
        if: failure()
        run: |
          set +e
          echo "=== Compact Surefire / Failsafe diagnostics ==="
          : > maven-failure-summary.txt
          grep -R -n -E \
            'Tests run:|Failures:|Errors:|<<< FAILURE|<<< ERROR|Caused by:|Exception|AssertionFailedError|FlywayException|PSQLException|BeanCreationException|ApplicationContext' \
            target/surefire-reports target/failsafe-reports 2>/dev/null \
            | grep -v '^.*testsuite.*errors="0".*failures="0"' \
            | head -n 300 \
            | tee maven-failure-summary.txt
          if [ ! -s maven-failure-summary.txt ]; then
            echo "No compact Maven failure lines were found." | tee maven-failure-summary.txt
          fi
          echo "=== End compact diagnostics ==="

      - name: Upload Maven failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-failure-reports
          path: |
            maven-failure-summary.txt
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: warn
          retention-days: 3

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

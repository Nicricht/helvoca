name: RecepVoz CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate console JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/operations.js
          node --check src/main/resources/static/simulator.js

      - name: Run backend tests
        id: backend
        continue-on-error: true
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress test 2>&1 | tee maven-test.log

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            maven-test.log
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 1

      - name: Fail if backend tests failed
        if: steps.backend.outcome != 'success'
        run: exit 1

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

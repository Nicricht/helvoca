name: RecepVoz CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  production-gate:
    needs: golden-journey-release-contract
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Fast production gate
        run: echo "Direct production mode enabled for main. Full verification runs on pull requests."

  meta-webhook-public-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify Meta webhook rejects invalid verification token
        run: |
          set -euo pipefail

          check_webhook() {
            local base_url="$1"
            local label="$2"
            local output
            local code

            output="$(mktemp)"
            code="$(curl --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 20 -sS -o "$output" -w "%{http_code}"               "$base_url/webhooks/v1/meta/whatsapp?hub.mode=subscribe&hub.challenge=recepvoz-safe-check&hub.verify_token=invalid")"

            echo "$label -> HTTP $code"
            if [ "$code" != "403" ]; then
              echo "Expected HTTP 403 from Meta webhook verification with an invalid token."
              echo "Response body:"
              head -c 500 "$output" || true
              echo
              exit 1
            fi

            if grep -Fq "recepvoz-safe-check" "$output"; then
              echo "Invalid verification token unexpectedly returned the challenge."
              exit 1
            fi
          }

          check_webhook "https://helvoca-api-production.up.railway.app" "Railway public domain"
          check_webhook "https://recepvoz.cl" "recepvoz.cl"

  pwa-public-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify public PWA assets in production
        run: |
          set -euo pipefail

          check_asset() {
            local base_url="$1"
            local path="$2"
            local label="$3"
            local code=""

            for attempt in $(seq 1 18); do
              code="$(curl --connect-timeout 10 --max-time 20 -sS -o /dev/null -w "%{http_code}" "$base_url$path" || true)"
              echo "$label $path -> HTTP $code (attempt $attempt/18)"

              if [ "$code" = "200" ]; then
                return 0
              fi

              if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "404" ]; then
                echo "PWA asset is not publicly available: $base_url$path"
                return 1
              fi

              sleep 10
            done

            echo "PWA asset never returned HTTP 200: $base_url$path"
            return 1
          }

          for path in /manifest.webmanifest /service-worker.js /recepvoz-icon-192.png /recepvoz-icon-512.png; do
            check_asset "https://helvoca-api-production.up.railway.app" "$path" "Railway"
            check_asset "https://recepvoz.cl" "$path" "recepvoz.cl"
          done

  golden-journey-release-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run commercial Golden Journey release contract
        run: bash scripts/ci/pilot-e2e-certification.sh

  fast-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run targeted Fast Gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/fast-gate.sh "$BASE_SHA"

  test:
    needs: [fast-gate, golden-journey-release-contract]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Report full verification pending
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PAYLOAD=$(printf '{"state":"pending","context":"helvoca/full-verification","description":"Full frontend/backend verification running"}')
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate console JavaScript
        run: |
          node --check e2e/react-public-entry-migration.spec.js
          node --check e2e/react-settings-core.spec.js
          node --check e2e/commercial-status.spec.js
          node --check e2e/react-settings-hardening.spec.js
          node --check e2e/frontend-ux.spec.js

      - name: Run backend tests with JaCoCo
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -Pcoverage test 2>&1 | tee backend-test.log

      - name: Enforce differential Java coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_LINE_COVERAGE: "100"
          DIFF_BRANCH_COVERAGE: "100"
          DIFF_METHOD_COVERAGE: "100"
        run: python3 scripts/ci/check_diff_coverage.py "$BASE_SHA"

      - name: Certify historical PR 764 request-reply code at 100 percent
        if: github.event_name == 'pull_request' && github.head_ref == 'test/request-reply-100-percent-20261008'
        env:
          DIFF_LINE_COVERAGE: "100"
          DIFF_BRANCH_COVERAGE: "100"
          DIFF_METHOD_COVERAGE: "100"
        run: python3 scripts/ci/check_diff_coverage.py "51e77b1991892e6ec5b1ead78dda5f776ae7e00d"

      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            backend-test.log
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: warn

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          VISUAL_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright-test.log

      - name: Upload frontend visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-evidence
          path: test-results/visual-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-test.log
            test-results/**
            playwright-report/**
          if-no-files-found: warn

      - name: Report full verification status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Full frontend/backend verification passed"
          else
            STATE="failure"
            DESCRIPTION="Full frontend/backend verification failed"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"helvoca/full-verification","description":"%s"}' "$STATE" "$DESCRIPTION")
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"


  system-integration-e2e:
    needs: [fast-gate, golden-journey-release-contract]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: helvoca
          POSTGRES_USER: helvoca
          POSTGRES_PASSWORD: helvoca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helvoca -d helvoca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run real stack system E2E
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/helvoca
          DB_USERNAME: helvoca
          DB_PASSWORD: helvoca
          SYSTEM_E2E_BASE_URL: http://127.0.0.1:8080
        run: bash scripts/ci/system-e2e.sh

      - name: Upload system E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-e2e-diagnostics
          path: |
            system-e2e-backend.log
            test-results/system-e2e/**
          if-no-files-found: warn



  frontend-qa:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[frontend-verify]') || contains(github.event.head_commit.message, '[verify]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report frontend QA pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PAYLOAD=$(printf '{"state":"pending","context":"helvoca/frontend-qa","description":"Frontend QA running"}')
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: |
          node --check e2e/react-public-entry-migration.spec.js
          node --check e2e/react-settings-core.spec.js
          node --check e2e/commercial-status.spec.js
          node --check e2e/react-settings-hardening.spec.js
          node --check e2e/frontend-ux.spec.js

      - name: Install frontend test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run all frontend E2E
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright-test.log

      - name: Upload frontend QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-qa-diagnostics
          path: |
            playwright-test.log
            test-results/**
            playwright-report/**
          if-no-files-found: warn

      - name: Report frontend QA status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Frontend QA passed"
          else
            STATE="failure"
            DESCRIPTION="Frontend QA failed"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"helvoca/frontend-qa","description":"%s"}' "$STATE" "$DESCRIPTION")
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"


  auth-qa:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[auth-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report auth QA pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PAYLOAD=$(printf '{"state":"pending","context":"helvoca/auth-qa","description":"Auth frontend QA running"}')
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate auth frontend JavaScript
        run: node --check e2e/react-public-entry-migration.spec.js

      - name: Install auth test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run auth frontend E2E
        run: npx playwright test e2e/frontend-ux.spec.js --grep "auth tabs|registration validates|login keeps"

      - name: Report auth QA status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Auth frontend QA passed"
          else

name: Helvoca CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate console JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/operations.js

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

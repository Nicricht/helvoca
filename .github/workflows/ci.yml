name: RecepVoz CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  production-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Fast production gate
        run: echo "Direct production mode enabled for main. Full verification runs on pull requests."

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify]'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report full verification pending
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PAYLOAD=$(printf '{"state":"pending","context":"helvoca/full-verification","description":"Full frontend/backend verification running"}')
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate console JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/phone-provisioning.js
          node --check src/main/resources/static/commercial-status.js
          node --check src/main/resources/static/voice-selector.js
          node --check src/main/resources/static/ux-simplification.js
          node --check src/main/resources/static/pricing.js
          node --check src/main/resources/static/home-business.js
          node --check src/main/resources/static/conversations.js
          node --check src/main/resources/static/settings-page.js
          node --check src/main/resources/static/operations.js
          node --check src/main/resources/static/simulator.js

      - name: Run backend tests
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress test 2>&1 | tee backend-test.log

      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            backend-test.log
            target/surefire-reports/**
          if-no-files-found: warn

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright-test.log

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-test.log
            test-results/**
            playwright-report/**
          if-no-files-found: warn

      - name: Report full verification status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Full frontend/backend verification passed"
          else
            STATE="failure"
            DESCRIPTION="Full frontend/backend verification failed"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"helvoca/full-verification","description":"%s"}' "$STATE" "$DESCRIPTION")
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"


  frontend-qa:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[frontend-verify]') || contains(github.event.head_commit.message, '[verify]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report frontend QA pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PAYLOAD=$(printf '{"state":"pending","context":"helvoca/frontend-qa","description":"Frontend QA running"}')
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/phone-provisioning.js
          node --check src/main/resources/static/commercial-status.js
          node --check src/main/resources/static/voice-selector.js
          node --check src/main/resources/static/ux-simplification.js
          node --check src/main/resources/static/pricing.js
          node --check src/main/resources/static/home-business.js
          node --check src/main/resources/static/conversations.js
          node --check src/main/resources/static/settings-page.js
          node --check src/main/resources/static/operations.js
          node --check src/main/resources/static/simulator.js

      - name: Install frontend test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run all frontend E2E
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright-test.log

      - name: Upload frontend QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-qa-diagnostics
          path: |
            playwright-test.log
            test-results/**
            playwright-report/**
          if-no-files-found: warn

      - name: Report frontend QA status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Frontend QA passed"
          else
            STATE="failure"
            DESCRIPTION="Frontend QA failed"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"helvoca/frontend-qa","description":"%s"}' "$STATE" "$DESCRIPTION")
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"


  auth-qa:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[auth-verify]')

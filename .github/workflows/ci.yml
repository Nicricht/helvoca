            DESCRIPTION="Auth frontend QA failed"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"helvoca/auth-qa","description":"%s"}' "$STATE" "$DESCRIPTION")
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"


  reservations-qa:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reservations-verify]')

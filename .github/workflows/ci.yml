          npx playwright install --with-deps chromium

      - name: Run orders requests customers E2E
        run: npx playwright test e2e/react-orders.spec.js e2e/react-legacy-capability-cutover.spec.js

      - name: Report workspace QA status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Orders requests customers QA passed"
          else

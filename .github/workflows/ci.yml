          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate auth frontend JavaScript
        run: node --check src/main/resources/static/app.js

      - name: Install auth test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run auth frontend E2E
        run: npx playwright test e2e/frontend-ux.spec.js --grep "auth tabs|registration validates|login keeps"

      - name: Report auth QA status
        if: always()

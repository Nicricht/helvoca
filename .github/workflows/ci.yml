          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run focused booking backend tests
        run: mvn --batch-mode --no-transfer-progress -Dtest=BookingServiceTest,BookingActivityServiceTest,CustomerProfileServiceTest,AuditQueryServiceTest,AuditExportServiceTest,CustomerExportServiceTest,RoleAuthorizationContractTest,PostgresRowLevelSecurityIntegrationTest,BookingIncidentDeliveryStatusServiceTest,TwilioWhatsAppMessagingProviderTest,TwilioWhatsAppDeliveryStatusServiceTest,TwilioWhatsAppDeliveryStatusControllerTest,OutboundDispatchOutboxServiceTest test

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate reservations JavaScript
        run: |
          node --check e2e/react-agenda.spec.js
          node --check e2e/react-legacy-capability-cutover.spec.js

      - name: Install reservations test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run reservations frontend E2E
        run: npx playwright test e2e/react-agenda.spec.js e2e/react-legacy-capability-cutover.spec.js

      - name: Report reservations QA status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Reservations frontend QA passed"
          else
            STATE="failure"
            DESCRIPTION="Reservations frontend QA failed"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"helvoca/reservations-qa","description":"%s"}' "$STATE" "$DESCRIPTION")
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"



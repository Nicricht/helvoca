name: Helvoca CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate console JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/operations.js

      - name: Verify Twilio live call control
        run: mvn --batch-mode --no-transfer-progress -Dtest=TwilioCallControlTest test

      - name: Verify Realtime human transfer contract
        run: mvn --batch-mode --no-transfer-progress -Dtest=OpenAiRealtimeTransferTest test

      - name: Verify Media Stream contract
        run: mvn --batch-mode --no-transfer-progress -Dtest=TwilioMediaStreamHandlerTest test

      - name: Verify production TwiML contract
        run: mvn --batch-mode --no-transfer-progress -Dtest=TrialTwimlFactoryTest test

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run operations browser E2E
        run: npm run test:e2e

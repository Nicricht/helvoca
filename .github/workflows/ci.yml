name: RecepVoz CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate console JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/phone-provisioning.js
          node --check src/main/resources/static/commercial-status.js
          node --check src/main/resources/static/voice-selector.js
          node --check src/main/resources/static/pricing.js
          node --check src/main/resources/static/operations.js
          node --check src/main/resources/static/simulator.js

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Surface Maven test failures
        if: failure()
        run: |
          echo "=== Surefire / Failsafe reports ==="
          found=0
          for dir in target/surefire-reports target/failsafe-reports; do
            if [ -d "$dir" ]; then
              while IFS= read -r -d '' report; do
                found=1
                echo
                echo "===== $report ====="
                cat "$report"
              done < <(find "$dir" -maxdepth 1 -type f \( -name '*.txt' -o -name 'TEST-*.xml' \) -print0 | sort -z)
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No Maven test report files were produced."
          fi

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

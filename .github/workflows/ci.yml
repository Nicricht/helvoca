          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

  conversations-qa:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[conversations-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report conversations QA pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PAYLOAD=$(printf '{"state":"pending","context":"helvoca/conversations-qa","description":"Conversations frontend QA running"}')
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$PAYLOAD" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate contextual conversations contract
        run: node --check e2e/react-agenda.spec.js

      - name: Install conversations test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run conversations E2E
        run: npx playwright test e2e/react-agenda.spec.js e2e/react-orders.spec.js --grep "conversation"

      - name: Report conversations QA status
        if: always()
        env:

name: Pilot Voice Phase 4 Integrated Offline Certification
on:
  push:
    branches:
      - 'test/voice-real-pilot-4of6-*'

permissions:
  contents: read

jobs:
  integrated-no-go-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWILIO_PROVISIONING_ENABLED: 'false'
      HELVOCA_TWILIO_EXISTING_VOICE_ROUTE_ENABLED: 'false'
      HELVOCA_TWILIO_SUBACCOUNT_VOICE_CONFIGURE_ON_STARTUP: 'false'
      TWILIO_CERTIFICATION_CALL_ON_STARTUP: 'false'
      GEMINI_LIVE_ENABLED: 'false'
      GEMINI_LIVE_PROBE_ON_STARTUP: 'false'
      HELVOCA_CONTROLLED_PILOT_EXTERNAL_EFFECTS_ENABLED: 'false'
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v7
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify tenant-first local plus carrier no-go integration, audio cleanup and RLS
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=VoicePilotIntegratedReadinessServiceTest,VoicePilotIntegratedReadinessControllerTest,VoiceRealCallPreflightServiceTest,VoiceCarrierOwnershipPreflightServiceTest,VoiceCarrierOwnershipPreflightControllerTest,TwilioLiveCallAdmissionReadinessTest,TwilioExistingNumberOwnershipVerifierTest,TwilioCallBindingGuardTest,TwilioVerifiedExistingVoiceRouteGateTest,TwilioSignatureValidatorTest,GeminiLiveFailureCleanupPhase3Test,GeminiLiveAudioInterruptionContractTest,GeminiLiveVoiceSessionTest,TwilioTenantBindingIntegrationTest,PostgresRowLevelSecurityIntegrationTest
          test

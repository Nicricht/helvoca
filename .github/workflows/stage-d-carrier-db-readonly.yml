name: Stage D Twilio Carrier vs PG Read-Only Audit (offline contract)

on:
  push:
    branches:
      - 'test/voice-pilot-stage-d-carrier-db-readonly-*'
  pull_request:
    paths:
      - 'scripts/ops/twilio_carrier_db_readonly_audit.py'
      - 'scripts/ops/test_twilio_carrier_db_readonly_audit.py'
      - 'scripts/ops/c2b_twilio_call_terminal_readonly.py'
      - 'scripts/ops/test_c2b_twilio_call_terminal_readonly.py'
      - '.github/workflows/stage-d-carrier-db-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-and-db-readonly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Ensure script contains no HTTP POST or mutations
        run: |
          python3 -m py_compile scripts/ops/twilio_carrier_db_readonly_audit.py
          python3 -m py_compile scripts/ops/test_twilio_carrier_db_readonly_audit.py
          python3 -m py_compile scripts/ops/c2b_twilio_call_terminal_readonly.py
          python3 -m py_compile scripts/ops/test_c2b_twilio_call_terminal_readonly.py
      - name: Execute mocked GET only and read-only database tests without credentials
        run: |
          python3 -m unittest discover -s scripts/ops -p 'test_twilio_carrier_db_readonly_audit.py' -v
          python3 -m unittest discover -s scripts/ops -p 'test_c2b_twilio_call_terminal_readonly.py' -v
      - name: Measure and enforce single-call Twilio GET Python statement and branch coverage
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'coverage==7.13.3'
          python3 -m coverage run --branch --source=c2b_twilio_call_terminal_readonly -m unittest discover -s scripts/ops -p 'test_c2b_twilio_call_terminal_readonly.py' -v
          python3 -m coverage json -o c2b-twilio-readonly-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("c2b-twilio-readonly-coverage.json").read_text(encoding="utf-8"))
          matches = [
              (path, entry) for path, entry in data["files"].items()
              if path.replace("\\", "/").endswith("/c2b_twilio_call_terminal_readonly.py")
              or path == "c2b_twilio_call_terminal_readonly.py"
          ]
          if len(matches) != 1:
              raise SystemExit("C2B_PYTHON_COVERAGE_TARGET_UNVERIFIED")
          summary = matches[0][1]["summary"]
          statements = summary["num_statements"]
          covered_statements = summary["covered_lines"]
          branches = summary["num_branches"]
          covered_branches = summary["covered_branches"]
          print(f"C2B_PYTHON_STATEMENTS: {covered_statements}/{statements}")
          print(f"C2B_PYTHON_BRANCHES: {covered_branches}/{branches}")
          if statements <= 0 or branches <= 0:
              raise SystemExit("C2B_PYTHON_COVERAGE_EMPTY")
          if covered_statements != statements or covered_branches != branches:
              raise SystemExit("C2B_PYTHON_DIFFERENTIAL_COVERAGE_NOT_100")
          print("C2B_PYTHON_COVERAGE_100_VERIFIED")
          PY

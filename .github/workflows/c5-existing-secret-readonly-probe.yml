name: C5 existing Mercado Pago secret identity GET only

on:
  push:
    branches:
      - 'probe/c5-existing-secret-readonly-20261014'

permissions:
  contents: read

concurrency:
  group: c5-existing-secret-readonly-20261014
  cancel-in-progress: false

jobs:
  identity-read-only:
    if: github.repository == 'Nicricht/helvoca' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Offline validation of probe before use of existing secret
        run: |
          python3 -m unittest discover -v -s scripts/ops -p 'test_c5_existing_secret_readonly_probe.py'
          python3 - <<'PY'
          from pathlib import Path
          script=Path('scripts/ops/c5_existing_secret_readonly_probe.py').read_text()
          assert 'method="GET"' in script
          assert 'method="POST"' not in script
          assert 'subscription' not in script.lower().replace('no api writes, checkout, subscription creation or token output.', '')
          assert 'print(token)' not in script and 'print(payload)' not in script
          print('C5_READONLY_PROBE_NO_WRITE_GUARD=PASS')
          PY
      - name: Check stored repository secret against owner's existing TEST seller (GET only)
        timeout-minutes: 2
        env:
          MERCADOPAGO_TEST_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
          # SHA-256 of TEST SELLER user ID | generated username | MLC,
          # from already supplied test-account screenshots. Not credentials.
          C5_EXPECTED_TEST_SELLER_FINGERPRINT: "c1e0f0f56ad01e0985f5491dc2c027ff6ef6b9264231903ae08e6c1f9b4c932c"
          C5_SELLER_ID_HASH: "0e8ff9d289fcb2db18f508768391eac717d3f5f7ce9539c88132cac90e077910"
          C5_BUYER_ID_HASH: "c9a8d91406270a0fb58f4b71f38d3e0272f1b3337b89003528c74b7ba650d933"
        run: python3 scripts/ops/c5_existing_secret_readonly_probe.py

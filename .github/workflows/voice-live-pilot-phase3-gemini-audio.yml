name: Pilot Voice Phase 3 Gemini Audio Offline
on:
  push:
    branches:
      - 'feat/voice-real-pilot-3of6-*'

permissions:
  contents: read

jobs:
  gemini-audio-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_LIVE_ENABLED: 'false'
      GEMINI_LIVE_PROBE_ON_STARTUP: 'false'
      TWILIO_CERTIFICATION_CALL_ON_STARTUP: 'false'
      HELVOCA_TWILIO_SUBACCOUNT_VOICE_CONFIGURE_ON_STARTUP: 'false'
      HELVOCA_CONTROLLED_PILOT_EXTERNAL_EFFECTS_ENABLED: 'false'
      TWILIO_PROVISIONING_ENABLED: 'false'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prove Gemini upstream and Twilio downstream close with audio codec and barge-in contracts
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=GeminiLiveFailureCleanupPhase3Test,GeminiLiveVoiceSessionTest,GeminiLiveAudioInterruptionContractTest,GeminiLiveLowLatencySetupTest,GeminiTwilioAudioFramerTest,LocalBargeInDetectorTest,PcmuAudioCodecTest,TwilioMediaStreamHandlerTest,TwilioMediaStreamStartupRecoveryPhase7Test,TwilioVoiceTransportSessionTest,VoiceProviderHealthRegistryTest
          test

name: Phase 6 Voice Cross Tenant PostgreSQL Security

# Synthetic, disposable PostgreSQL only; never public webhooks or live providers.
on:
  push:
    branches:
      - 'test/voice-cross-tenant-postgres-phase6-*'

permissions:
  contents: read

jobs:
  voice-rls-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWILIO_PROVISIONING_ENABLED: 'false'
      HELVOCA_TWILIO_EXISTING_VOICE_ROUTE_ENABLED: 'false'
      GEMINI_LIVE_ENABLED: 'false'
      GEMINI_LIVE_PROBE_ON_STARTUP: 'false'
      HELVOCA_CONTROLLED_PILOT_EXTERNAL_EFFECTS_ENABLED: 'false'
    steps:
      - name: Checkout isolated SHA
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test two-tenant RLS, verified-existing claims, calls and realtime tools in PostgreSQL 16
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=TwilioVerifiedExistingVoiceRoutePostgresIntegrationTest,TwilioTenantBindingIntegrationTest,PostgresRowLevelSecurityIntegrationTest,RealtimeToolTenantScopeIntegrationTest
          test

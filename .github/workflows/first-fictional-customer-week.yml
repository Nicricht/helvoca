name: First Fictional Customer Week

on:
  push:
    branches:
      - test/first-fictional-customer-week-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-week:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Certify first fictional customer week
        run: bash scripts/ci/first-fictional-customer-week.sh

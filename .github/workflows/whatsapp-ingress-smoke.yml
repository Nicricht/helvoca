name: WhatsApp ingress smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/whatsapp-ingress-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: POST unsigned WhatsApp webhook to production
        shell: bash
        run: |
          set -euo pipefail
          url="https://helvoca-api-production.up.railway.app/webhooks/v1/twilio/whatsapp"
          body_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$body_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "MessageSid=SM-smoke-ingress" \
            --data-urlencode "From=whatsapp:+56911111111" \
            --data-urlencode "To=whatsapp:+56922222222" \
            --data-urlencode "Body=smoke" \
            "$url")"

          body="$(cat "$body_file")"
          echo "HTTP $http_code"
          echo "Response: $body"

          # Reaching this exact Twilio guard proves the POST arrived at Helvoca.
          # The smoke deliberately omits X-Twilio-Signature so production must fail closed.
          test "$http_code" = "403"
          test "$body" = "Invalid Twilio signature"

name: Branch hygiene Part 2 exact merged cleanup

on:
  push:
    branches:
      - chore/branch-hygiene-20261007
    paths:
      - .github/workflows/branch-hygiene-part2.yml

permissions:
  contents: write

concurrency:
  group: branch-hygiene-part2-20261007
  cancel-in-progress: false

jobs:
  delete-safe-exact-merged:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: 0780f372a1ac8963f0e1c937596e4ea20bc4c051
      AUDIT_BRANCH: chore/branch-hygiene-20261007
      CANDIDATES_FILE: docs/repository/branch-hygiene-safe-exact-merged-2026-10-07.json
      CONTENT_EQ_FILE: docs/repository/branch-hygiene-safe-content-equivalent-2026-10-07.json
      REVIEW_FILE: docs/repository/branch-hygiene-review-required-2026-10-07.json
    steps:
      - uses: actions/checkout@v4

      - name: Revalidate and delete exact merged refs
        id: cleanup
        shell: bash
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          owner = repo.split("/", 1)[0]
          token = os.environ["GH_TOKEN"]
          expected_main = os.environ["EXPECTED_MAIN_SHA"]
          audit_branch = os.environ["AUDIT_BRANCH"]

          def api(method, path, query=None):
              url = "https://api.github.com" + path
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "helvoca-branch-hygiene-part2",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(body) if body else None
                  except json.JSONDecodeError:
                      payload = {"raw": body}
                  return exc.code, payload

          def get_branch(name):
              encoded = urllib.parse.quote(name, safe="")
              return api("GET", f"/repos/{repo}/branches/{encoded}")

          def list_all_branches():
              result = []
              page = 1
              while True:
                  status, payload = api("GET", f"/repos/{repo}/branches", {"per_page": 100, "page": page})
                  if status != 200:
                      raise RuntimeError(f"branch listing failed: HTTP {status}: {payload}")
                  result.extend(payload)
                  if len(payload) < 100:
                      return result
                  page += 1

          with open(os.environ["CANDIDATES_FILE"], encoding="utf-8") as handle:
              certificate = json.load(handle)
          with open(os.environ["CONTENT_EQ_FILE"], encoding="utf-8") as handle:
              content_equivalent = json.load(handle)
          with open(os.environ["REVIEW_FILE"], encoding="utf-8") as handle:
              review_required = json.load(handle)

          started_at = datetime.datetime.now(datetime.timezone.utc).isoformat()
          main_status, main_before = get_branch("main")
          if main_status != 200 or main_before["commit"]["sha"] != expected_main:
              raise SystemExit(
                  f"ABORT: main mismatch before deletion: HTTP {main_status}, "
                  f"actual={main_before.get('commit', {}).get('sha') if isinstance(main_before, dict) else None}"
              )

          report = []
          deleted = 0
          skipped = 0
          delete_failed = 0

          for candidate in certificate["candidates"]:
              branch = candidate["branch"]
              cert_sha = candidate["sha"]
              merged_pr_number = candidate["merged_pr"]
              row = {
                  "branch": branch,
                  "certified_sha": cert_sha,
                  "merged_pr": merged_pr_number,
              }

              def skip(reason, **extra):
                  nonlocal_placeholder = None
                  row.update({"outcome": "SKIPPED", "reason": reason, **extra})
                  report.append(row)

              if branch in {"main", audit_branch}:
                  skip("SPECIAL_KEEP")
                  skipped += 1
                  continue

              status, branch_data = get_branch(branch)
              if status == 404:
                  skip("MISSING_AT_REVALIDATION")
                  skipped += 1
                  continue
              if status != 200:
                  skip("BRANCH_READ_FAILED", http_status=status)
                  skipped += 1
                  continue
              if branch_data.get("protected"):
                  skip("PROTECTED_AT_REVALIDATION")
                  skipped += 1
                  continue

              status, open_prs = api(
                  "GET",
                  f"/repos/{repo}/pulls",
                  {"state": "open", "head": f"{owner}:{branch}", "per_page": 1},
              )
              if status != 200:
                  skip("OPEN_PR_CHECK_FAILED", http_status=status)
                  skipped += 1
                  continue
              if open_prs:
                  skip("OPEN_PR_HEAD", open_pr=open_prs[0]["number"])
                  skipped += 1
                  continue

              current_sha = branch_data["commit"]["sha"]
              if current_sha != cert_sha:
                  skip("SHA_CHANGED", current_sha=current_sha)
                  skipped += 1
                  continue

              status, merged_pr = api("GET", f"/repos/{repo}/pulls/{merged_pr_number}")
              if status != 200:
                  skip("MERGED_PR_READ_FAILED", http_status=status)
                  skipped += 1
                  continue
              if not merged_pr.get("merged_at"):
                  skip("PR_NOT_MERGED")
                  skipped += 1
                  continue
              if merged_pr.get("head", {}).get("sha") != cert_sha:
                  skip("MERGED_PR_HEAD_MISMATCH", pr_head_sha=merged_pr.get("head", {}).get("sha"))
                  skipped += 1
                  continue

              # Final lease-style read immediately before deletion.
              status, final_branch = get_branch(branch)
              if status != 200:
                  skip("FINAL_BRANCH_READ_FAILED", http_status=status)
                  skipped += 1
                  continue
              if final_branch.get("protected"):
                  skip("PROTECTED_ON_FINAL_READ")
                  skipped += 1
                  continue
              final_sha = final_branch["commit"]["sha"]
              if final_sha != cert_sha:
                  skip("SHA_CHANGED_ON_FINAL_READ", current_sha=final_sha)
                  skipped += 1
                  continue

              ref_path = "heads/" + branch
              encoded_ref = urllib.parse.quote(ref_path, safe="/")
              status, payload = api("DELETE", f"/repos/{repo}/git/refs/{encoded_ref}")
              if status != 204:
                  row.update({"outcome": "DELETE_FAILED", "reason": "DELETE_API_FAILED", "http_status": status, "response": payload})
                  report.append(row)
                  delete_failed += 1
                  continue

              verify_status, _ = get_branch(branch)
              if verify_status != 404:
                  row.update({"outcome": "DELETE_UNVERIFIED", "reason": "BRANCH_STILL_READABLE", "http_status": verify_status})
                  report.append(row)
                  delete_failed += 1
                  continue

              row.update({"outcome": "DELETED", "reason": "EXACT_MERGED_REVALIDATED"})
              report.append(row)
              deleted += 1

          post_branches = list_all_branches()
          post_by_name = {branch["name"]: branch for branch in post_branches}
          main_after = post_by_name.get("main", {}).get("commit", {}).get("sha")
          status, pr752 = api("GET", f"/repos/{repo}/pulls/752")
          review_missing = [
              item["branch"] for item in review_required["branches"]
              if item["branch"] not in post_by_name
          ]
          content_equivalent_missing = [
              item["branch"] for item in content_equivalent["branches"]
              if item["branch"] not in post_by_name
          ]
          exact_remaining = [
              item["branch"] for item in certificate["candidates"]
              if item["branch"] in post_by_name
          ]

          summary = {
              "schema": "helvoca.branch-hygiene.part2-exact-merged.v1",
              "started_at": started_at,
              "finished_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": repo,
              "baseline_main_sha": expected_main,
              "main_sha_after": main_after,
              "certified_candidates": len(certificate["candidates"]),
              "deleted": deleted,
              "skipped": skipped,
              "delete_failed_or_unverified": delete_failed,
              "post_branch_count": len(post_branches),
              "exact_candidates_remaining": exact_remaining,
              "review_required_expected": len(review_required["branches"]),
              "review_required_missing": review_missing,
              "content_equivalent_expected": len(content_equivalent["branches"]),
              "content_equivalent_missing": content_equivalent_missing,
              "pr_752": {
                  "http_status": status,
                  "state": pr752.get("state") if isinstance(pr752, dict) else None,
                  "merged_at": pr752.get("merged_at") if isinstance(pr752, dict) else None,
                  "draft": pr752.get("draft") if isinstance(pr752, dict) else None,
                  "head_ref": pr752.get("head", {}).get("ref") if isinstance(pr752, dict) else None,
                  "title": pr752.get("title") if isinstance(pr752, dict) else None,
              },
          }

          with open("branch-hygiene-part2-report.json", "w", encoding="utf-8") as handle:
              json.dump({"summary": summary, "branches": report}, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          with open("branch-hygiene-part2-summary.json", "w", encoding="utf-8") as handle:
              json.dump(summary, handle, indent=2, ensure_ascii=False)
              handle.write("\n")

          print(json.dumps(summary, indent=2, ensure_ascii=False))

          valid_outcomes = deleted + skipped + delete_failed == len(certificate["candidates"])
          post_ok = (
              main_after == expected_main
              and status == 200
              and pr752.get("state") == "open"
              and pr752.get("merged_at") is None
              and pr752.get("head", {}).get("ref") == audit_branch
              and not review_missing
              and not content_equivalent_missing
          )
          if not valid_outcomes or delete_failed or not post_ok:
              sys.exit(1)
          PY

      - name: Upload exact deletion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-hygiene-part2-evidence
          path: |
            branch-hygiene-part2-report.json
            branch-hygiene-part2-summary.json
          if-no-files-found: error
          retention-days: 30

name: Temporary apply E2E runtime fix

on:
  push:
    branches:
      - fix/e2e-mutation-observer-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2e-mutation-observer-20260917

      - name: Apply minimal runtime fixes
        shell: python
        run: |
          from pathlib import Path

          voice = Path('src/main/resources/static/voice-selector.js')
          text = voice.read_text()
          old = """    // The UX layer replaces the original advanced panel with a new shell.\n    // Pause observation while normalizing that shell so our own synchronous\n    // DOM writes cannot recursively schedule the observer again.\n    const configurationObserverOptions = {\n        childList: true,\n        subtree: true,\n        characterData: true,\n        attributes: true,\n        attributeFilter: ['aria-expanded']\n    };\n    const configurationObserver = new MutationObserver(() => {\n        configurationObserver.disconnect();\n        try {\n            const hub = document.querySelector('#advancedPanel.ux-config-hub');\n            if (hub) {\n                hub.dataset.uxEnhanced = 'true';\n                compactConfigNav();\n                cleanBusinessHeadings();\n                compactBusinessPanel();\n                compactPermissionsPanel();\n                setupBusinessDisclosure();\n            }\n            compactCommercialStatus();\n        } finally {\n            configurationObserver.observe(document.body, configurationObserverOptions);\n        }\n    });\n    configurationObserver.observe(document.body, configurationObserverOptions);\n\n    compactConfigNav();\n    cleanBusinessHeadings();\n    compactBusinessPanel();\n    compactPermissionsPanel();\n    setupBusinessDisclosure();\n    compactCommercialStatus();\n"""
          new = """    // The UX shell is built synchronously before this dynamically loaded script runs.\n    // Normalize it once. A global DOM observer here can feed back into the UX observer\n    // and keep the browser main thread busy after asynchronous dashboard updates.\n    compactConfigNav();\n    cleanBusinessHeadings();\n    compactBusinessPanel();\n    compactPermissionsPanel();\n    setupBusinessDisclosure();\n"""
          if old not in text:
              raise SystemExit('voice-selector observer block not found')
          voice.write_text(text.replace(old, new, 1))

          phone = Path('src/main/resources/static/phone-provisioning.js')
          text = phone.read_text()
          old = """        if (!rows.length) {\n            summary?.remove();\n            modes.classList.remove('hidden');\n            existingPanel.classList.remove('hidden');\n            newPanel.classList.add('hidden');\n            return;\n        }\n"""
          new = """        if (!rows.length) {\n            summary?.remove();\n            modes.classList.remove('hidden');\n            if (existingPanel.classList.contains('hidden') && newPanel.classList.contains('hidden')) {\n                existingPanel.classList.remove('hidden');\n            }\n            return;\n        }\n"""
          if old not in text:
              raise SystemExit('phone empty-summary block not found')
          phone.write_text(text.replace(old, new, 1))

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/static/voice-selector.js src/main/resources/static/phone-provisioning.js
          git diff --cached --check
          git commit -m "fix: stabilize dashboard E2E runtime"
          git push

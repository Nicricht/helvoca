name: Helvoca PostgreSQL 18 Voice Pilot Compatibility
on:
  push:
    branches:
      - 'test/voice-pilot-postgres18-compatibility-*'

permissions:
  contents: read

jobs:
  migration-rls-postgres18:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELVOCA_TWILIO_EXISTING_VOICE_ROUTE_ENABLED: 'false'
      HELVOCA_TWILIO_SUBACCOUNT_VOICE_CONFIGURE_ON_STARTUP: 'false'
      HELVOCA_CONTROLLED_PILOT_EXTERNAL_EFFECTS_ENABLED: 'false'
      GEMINI_LIVE_ENABLED: 'false'
      TWILIO_PROVISIONING_ENABLED: 'false'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Flyway V100-V103 and tenant isolation against ephemeral PostgreSQL 18
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dhelvoca.test.postgres.image=postgres:18-alpine
          -Dtest=TwilioVerifiedExistingMigrationPostgresIntegrationTest,PostgresRowLevelSecurityIntegrationTest
          test

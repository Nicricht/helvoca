name: Software Factory

on:
  pull_request:
  workflow_dispatch:

jobs:
  first-pass-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run repository verification
        env:
          FIRST_PASS_RISK: ${{ inputs.risk || 'MEDIUM' }}
        run: scripts/verify
